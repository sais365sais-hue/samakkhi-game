let ac,mute=false,G,tm,sel,hinted;
const $=s=>document.querySelector(s),shuf=a=>[...a].sort(()=>Math.random()-.5);
function snd(f,d=.15,t='sine'){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sOk=()=>{snd(660);setTimeout(()=>snd(880),120)},sBad=()=>snd(180,.3,'sawtooth'),sWin=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.2),i*140));
const total=()=>D.reduce((s,x)=>s+x.q.reduce((a,q)=>a+(q.p||10),0),0);
function reset(){G={name:'',st:0,qi:0,sc:0,un:100,coin:0,open:1,res:D.map(()=>[])}}
function hud(){return`<div class="hud"><b>${G.name||''}</b><span>⭐ ${G.sc}</span><span>🪙 ${G.coin}</span><span>🛡️ ความสามัคคี</span><div class="bar"><i style="width:${Math.max(G.un,0)}%"></i></div><button class="btn g" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'" aria-label="เปิดปิดเสียง">${mute?'🔇':'🔊'}</button></div>`}
function start(){reset();$('#app').innerHTML=`<div class="hero card pop"><div class="em">🏯⚔️👑</div><h1>สามัคคีเภทคำฉันท์: ภารกิจหยุดแผนลับ ทำลายแคว้นวัชชี</h1><p>ความลับกำลังถูกเปิดเผย ความไว้วางใจกำลังสั่นคลอน คุณจะช่วยแคว้นวัชชีได้หรือไม่?</p><label for="nm">ชื่อผู้เล่นหรือชื่อทีม</label><input id="nm" maxlength="30" placeholder="เช่น ทีมผู้พิทักษ์ ม.6/1"><p><button class="btn" onclick="G.name=$('#nm').value.trim()||'ผู้พิทักษ์นิรนาม';map()">START GAME</button></p><small>เล่นเป็นทีม 4–5 คน ปรึกษากันก่อนเลือกคำตอบ ใช้เวลา 30–40 นาที</small></div>`}
function map(){clearInterval(tm);$('#app').innerHTML=hud()+`<h2>แผนที่ภารกิจ</h2><div class="map">${D.map((s,i)=>`<button class="node" ${i<G.open?'':'disabled'} onclick="G.st=${i};G.qi=0;ask()"><span>${i<G.open?s.ic:'🔒'}</span><div><b>ด่านที่ ${i+1}: ${s.n}</b><br><small>${G.res[i].length>=s.q.length?'ผ่านแล้ว ✔ เล่นซ้ำได้':i<G.open?'พร้อมเล่น':'ผ่านด่านก่อนหน้าเพื่อปลดล็อก'}</small></div></button>`).join('')}</div>`}
function ask(){clearInterval(tm);const s=D[G.st],q=s.q[G.qi];sel=null;hinted=0;
if(G.qi===0)G.res[G.st]=[];
const head=hud()+`<div class="card"><small>ด่านที่ ${G.st+1} ${s.n} · ข้อ ${G.qi+1}/${s.q.length}${q.b?' · โบนัสหลักฐาน +5':''}</small>`;
if(q.t==='o'){G.pool=shuf(q.items);if(G.pool.join()===q.items.join())G.pool.reverse();G.ans=[];G.tries=0;$('#app').innerHTML=head+`<h3>${q.q}</h3><div class="zone" id="za"></div><div id="zp"></div><div id="fb"></div><div id="ct"><button class="btn" id="chk" onclick="chkO()">ตรวจคำตอบ</button><button class="btn g" onclick="hint()">💡 คำใบ้ (-3)</button></div></div>`;drawO();return}
let t=s.tm?`<div class="bar"><i id="tb" style="width:100%;transition:none"></i></div>`:'';
$('#app').innerHTML=head+`${t}<h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${o}</button>`).join('')}<div id="fb"></div><div id="ct"><button class="btn" id="chk" disabled onclick="chk()">ตรวจคำตอบ</button>${q.h?'<button class="btn g" onclick="hint()">💡 คำใบ้ (-3)</button>':''}</div></div>`;
if(s.tm){let l=s.tm*10;tm=setInterval(()=>{l--;$('#tb').style.width=l/(s.tm*10)*100+'%';if(l<=0){clearInterval(tm);chk(1)}},100)}}
function pick(i){if($('#chk').disabled&&sel!==null)return;sel=i;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i));$('#chk').disabled=false}
function hint(){const q=D[G.st].q[G.qi];hinted=1;$('#fb').innerHTML=`<div class="fb">💡 ${q.h}</div>`}
function done(ok,q,msg){clearInterval(tm);const pts=ok?Math.max((q.p||10)-(hinted?3:0),1):0;G.sc+=pts;if(ok){G.coin++;sOk()}else{G.un-=10;sBad()}G.res[G.st].push(ok?pts:0);
$('#fb').innerHTML=`<div class="fb pop">${ok?'✅ ถูกต้อง +'+pts+' คะแนน':'❌ ยังไม่ถูก'} ${msg||''}<br>${q.e}</div>`;
$('#ct').innerHTML=`<button class="btn" onclick="next()">${G.qi+1<D[G.st].q.length?'ข้อต่อไป':'สรุปด่าน'}</button>`;}
function chk(to){const q=D[G.st].q[G.qi];document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('right');else if(j===sel)b.classList.add('wrong')});done(!to&&sel===q.a,q,to?'(หมดเวลา)':'')}
function drawO(){const q=D[G.st].q[G.qi];$('#za').innerHTML=G.ans.map((t,i)=>`<button class="chip" onclick="G.pool.push(G.ans.splice(${i},1)[0]);drawO()">${i+1}. ${t}</button>`).join('')||'<small>แตะการ์ดด้านล่างเพื่อวางตามลำดับ</small>';$('#zp').innerHTML=G.pool.map((t,i)=>`<button class="chip" onclick="G.ans.push(G.pool.splice(${i},1)[0]);drawO()">${t}</button>`).join('')}
function chkO(){const q=D[G.st].q[G.qi];if(G.pool.length){$('#fb').innerHTML='<div class="fb">วางการ์ดให้ครบทุกใบก่อน</div>';return}
if(G.ans.join()===q.items.join()){document.querySelectorAll('.chip').forEach(b=>b.disabled=true);hinted=hinted||G.tries>0;done(true,q)}
else{G.tries++;G.sc=Math.max(G.sc-2,0);sBad();$('#fb').innerHTML=`<div class="fb">❌ ลำดับยังไม่ถูก (-2) 💡 ${q.h}</div>`;if(G.tries>=3){G.ans=[...q.items];drawO();document.querySelectorAll('.chip').forEach(b=>b.disabled=true);done(false,q,'(เฉลยให้แล้ว)')}}}
function next(){const s=D[G.st];if(++G.qi<s.q.length)return ask();
const max=s.q.reduce((a,q)=>a+(q.p||10),0),got=G.res[G.st].reduce((a,b)=>a+b,0),r=got/max,medal=r>=.8?'🥇 เหรียญทอง':r>=.5?'🥈 เหรียญเงิน':'🥉 เหรียญทองแดง';
sWin();G.coin+=r>=.8?3:r>=.5?2:1;if(G.st+1===G.open&&G.open<5)G.open++;
try{localStorage.setItem('sk',JSON.stringify({n:G.name,sc:G.sc}))}catch(e){}
$('#app').innerHTML=hud()+`<div class="card pop"><h2>ผ่านด่าน: ${s.n}</h2><p>${medal} · ได้ ${got}/${max} คะแนน</p><p>${r>=.8?'ยอดเยี่ยม! วิเคราะห์ได้แม่นยำ':r>=.5?'ทำได้ดี ลองทบทวนข้อที่พลาดเพื่อพัฒนาต่อ':'เก่งมากที่ไม่ยอมแพ้ ลองกลับมาเล่นด่านนี้ซ้ำเพื่อเก็บคะแนนเพิ่ม'}</p><div class="bar"><i style="width:${G.open*20-(G.st+1<5&&G.st+1<G.open?0:0)}%"></i></div><p><small>ความคืบหน้า ${Math.min(G.st+1,5)}/5 ด่าน</small></p>${G.st===4?'<button class="btn" onclick="fin()">ดูฉากจบ</button>':'<button class="btn" onclick="map()">กลับแผนที่</button>'}</div>`}
function fin(){const r=G.sc/total(),e=r>=.85?['🛡️ ผู้พิทักษ์แห่งวัชชี','เข้าใจเนื้อหาและวิเคราะห์ได้ยอดเยี่ยม ท่านรักษาแคว้นไว้ได้'] :r>=.6?['🧠 นักวางกลยุทธ์ผู้ชาญฉลาด','วิเคราะห์เหตุการณ์ได้ดี แคว้นรอดมาได้ แม้ยังมีรอยร้าว']:['📖 นักเรียนรู้ผู้ไม่ยอมแพ้','พัฒนาความรู้ผ่านการแก้ปัญหา เล่นซ้ำเพื่อปกป้องแคว้นให้ได้'];
$('#app').innerHTML=hud()+`<div class="card pop hero"><h1>${e[0]}</h1><p>${e[1]}</p><p><b>${G.sc}</b> / ${total()} คะแนน (${Math.round(r*100)}%) · 🪙 ${G.coin} เหรียญ</p></div>
<div class="card"><h3>สรุปสำหรับครู</h3><table><tr><th>ด่าน</th><th>ตอบถูก</th><th>คะแนน</th></tr>${D.map((s,i)=>`<tr><td>${i+1}. ${s.n}</td><td>${G.res[i].filter(x=>x>0).length}/${s.q.length}</td><td>${G.res[i].reduce((a,b)=>a+b,0)}</td></tr>`).join('')}</table></div>
<div class="card"><h3>คำถามสะท้อนคิด</h3><p>เหตุใดความแตกสามัคคีจึงนำไปสู่ความพ่ายแพ้ และเราจะป้องกันปัญหานี้ในชีวิตจริงได้อย่างไร</p><textarea rows="4" placeholder="ช่วยกันเขียนคำตอบของทีม"></textarea></div>
<button class="btn" onclick="start()">เล่นใหม่</button><button class="btn g" onclick="map()">กลับไปแผนที่</button>`}
start();
</script></body></html>
